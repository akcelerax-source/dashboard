# Backup keep-alive for the Render free plan (the server also pings itself).
# GitHub may delay scheduled runs; the server-side ping covers the gaps.
name: Keep Render service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://nodex-ace.onrender.com/healthz
